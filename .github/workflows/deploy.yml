name: Deploy to cdmon

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. PHP ─────────────────────────────────────────────────────────────
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, openssl, pdo, tokenizer, xml, ctype, json, bcmath

      # ─── 3. Composer (con caché para acelerar deploys sucesivos) ────────────
      - name: Get Composer cache directory
        id: composer-cache-dir
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # ─── 4. Deploy public assets (web/) → public_html/ ─────────────────────
      #       Esta carpeta es la raíz web del dominio en cdmon
      - name: Deploy public assets → public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./web/
          server-dir: ./web/
          state-name: .ftp-state-web.json
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/* copy.*
            **/*copy*

      # ─── 5. vendor/ → ./vendor/ ────────────────────────────────────────────
      #       Tanda propia amb el seu fitxer d'estat: el primer deploy puja ~3000
      #       fitxers i cdmon talla la connexio a mitges (ECONNRESET). L'accio
      #       nomes desa l'estat en acabar, aixi que cada tanda ha de ser prou
      #       petita per completar-se. Tres intents; el segon i el tercer nomes
      #       corren si ha fallat l'anterior. Un cop desat l'estat, els deploys
      #       seguents nomes pugen el que canvia del composer.lock.
      - name: Deploy vendor/ (intent 1)
        id: vendor1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          local-dir: ./vendor/
          server-dir: ./vendor/
          state-name: .ftp-state-vendor.json
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/tests/**
            **/*.md
            **/* copy.*
            **/*copy*

      - name: Deploy vendor/ (intent 2)
        id: vendor2
        if: steps.vendor1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          local-dir: ./vendor/
          server-dir: ./vendor/
          state-name: .ftp-state-vendor.json
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/tests/**
            **/*.md
            **/* copy.*
            **/*copy*

      - name: Deploy vendor/ (intent 3)
        if: steps.vendor2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          local-dir: ./vendor/
          server-dir: ./vendor/
          state-name: .ftp-state-vendor.json
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/tests/**
            **/*.md
            **/* copy.*
            **/*copy*

      # ─── 6. Laravel core → directorio home del FTP ─────────────────────────
      #       Sube app/, config/, routes/, resources/, etc.
      #       NUNCA sube web/ ni vendor/ (tandas propias), .env ni logs
      - name: Deploy Laravel core (intent 1)
        id: core1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          local-dir: ./
          server-dir: ./
          state-name: .ftp-state-core.json
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.*
            **/web/**
            **/vendor/**
            public
            public/**
            errors/**
            logs/**
            .ftpquota
            **/tests/**
            **/storage/logs/**
            **/.github/**
            **/Homestead.*
            **/*.md
            **/npm-debug.log
            **/yarn-error.log
            **/.phpunit.result.cache
            **/* copy.*
            **/*copy*
            **/*.sql
            **/*.zip

      - name: Deploy Laravel core (intent 2)
        id: core2
        if: steps.core1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          local-dir: ./
          server-dir: ./
          state-name: .ftp-state-core.json
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.*
            **/web/**
            **/vendor/**
            public
            public/**
            errors/**
            logs/**
            .ftpquota
            **/tests/**
            **/storage/logs/**
            **/.github/**
            **/Homestead.*
            **/*.md
            **/npm-debug.log
            **/yarn-error.log
            **/.phpunit.result.cache
            **/* copy.*
            **/*copy*
            **/*.sql
            **/*.zip

      - name: Deploy Laravel core (intent 3)
        if: steps.core2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          local-dir: ./
          server-dir: ./
          state-name: .ftp-state-core.json
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.*
            **/web/**
            **/vendor/**
            public
            public/**
            errors/**
            logs/**
            .ftpquota
            **/tests/**
            **/storage/logs/**
            **/.github/**
            **/Homestead.*
            **/*.md
            **/npm-debug.log
            **/yarn-error.log
            **/.phpunit.result.cache
            **/* copy.*
            **/*copy*
            **/*.sql
            **/*.zip
